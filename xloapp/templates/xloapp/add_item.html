<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  {% load static %}
  <link rel="stylesheet" type="text/css" href="{% static 'forms.css' %}">
</head>
<body>
<header>
    <h1><a href="{% url 'home' %}">XLO</a></h1>
    <div class="profile-button">
      <div class="profile-picture-header">
        <img src="{{user.foto}}" alt="User Photo">
      </div>
      <a href="{% url 'view_perfil' utilizador_username_id=user.id%}" class="username-button">{{user.username}}</a>
      <a href="{% url 'logout' %}" class="logout-button">Logout</a>
    </div>
  </header>

<div class="container">
    <div class="sidebar">
      <ul class="navigation">
        <li><a href="{% url 'home' %}">Ver Todos</a></li>
        {% for categoria in categorias %}
          <li class="dropdown">
            <a href="{% url 'category_items' cat=categoria.cat %}">{{ categoria.cat }}</a>
            <ul class="submenu">
              {% for subcategoria in categoria.sub %}
                <li><a href="{% url 'category_sub_items' cat=categoria.cat sub=subcategoria.sub %}">{{ subcategoria.sub }}</a></li>
              {% endfor %}
            </ul>
          </li>
        {% endfor %}
      </ul>
    </div>

    <div class="form-container">

    <form method="POST" action="{% url 'add_item_view' utilizador_username_id=user.id%}">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Add Item" class="add-item-button">
    </form>
</div>
</div>
</body>
</html>
